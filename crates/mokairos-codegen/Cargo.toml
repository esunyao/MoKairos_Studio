[package]
name = "mokairos-codegen"
version = "0.1.0"
description = "MoKairos Studio 通用 RoboMaster UI 代码生成库与 CLI"
authors = ["Esuny"]
edition = "2024"

[lib]
name = "mokairos_codegen"
path = "src/lib.rs"

[[bin]]
name = "mokairos-ui"
path = "src/bin/mokairos-ui.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
minijinja = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
